[workspace]
resolver = "3"
members = ["crates/*"]
# The spike is throwaway evidence (item 01), not part of the library.
exclude = ["spike"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
ratatui = "0.30.2"
ratatui-core = "0.1.2"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
tuipalette-core = { path = "crates/tuipalette-core" }
tuipalette-tui = { path = "crates/tuipalette-tui" }
